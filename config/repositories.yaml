server:
  host: 0.0.0.0
  port: 8080

data_dir: /var/lib/team-skill-hub

default_roles:
  - developer
  - internal

authentication:
  mode: development

repositories:
  - id: rd-skills
    name: R&D Skills
    provider: git
    git_url: git@github.com:shh632058099/rd-skills.git
    branch: master
    git_auth:
      type: none
    enabled: true
    webhook_aliases:
      - shh632058099/rd-skills
      - rd-skills
    audience:
      - developer
    visibility:
      - internal
    knowledge:
      enabled: true
    knowledge_publishing:
      enabled: true
      provider: github
      base_url: https://github.com
      project_path: shh632058099/rd-knowledges
      token_env: GITHUB_TOKEN
      target_branch: main
      branch_prefix: skill-hub-knowledge
    skill_publishing:
      enabled: true
      provider: github
      base_url: https://github.com
      project_path: shh632058099/rd-skills
      token_env: GITHUB_TOKEN
      target_branch: master
      branch_prefix: skill-hub-skill
    access:
      read_roles:
        - developer
        - internal
      sync_roles:
        - developer
        - admin
    sync:
      polling_interval: 300

  - id: rd-knowledges
    name: R&D Knowledges
    provider: git
    git_url: git@github.com:shh632058099/rd-knowledges.git
    branch: main
    git_auth:
      type: none
    enabled: true
    webhook_aliases:
      - shh632058099/rd-knowledges
      - rd-knowledges
    audience:
      - developer
    visibility:
      - internal
    knowledge:
      enabled: true
    knowledge_publishing:
      enabled: true
      provider: github
      base_url: https://github.com
      project_path: shh632058099/rd-knowledges
      token_env: GITHUB_TOKEN
      target_branch: main
      branch_prefix: skill-hub-knowledge
    access:
      read_roles:
        - developer
        - internal
      sync_roles:
        - developer
        - admin
    sync:
      polling_interval: 300

  - id: customer-skills
    name: Customer Skills
    provider: local
    path: /skills/customer-skills
    enabled: true
    audience:
      - customer
    visibility:
      - customer
    access:
      read_roles:
        - customer
      sync_roles:
        - admin
    sync:
      polling_interval: 300
