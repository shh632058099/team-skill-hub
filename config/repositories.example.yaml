server:
  host: 0.0.0.0
  port: 8080

data_dir: /var/lib/team-skill-hub

default_roles:
  - developer
  - internal

authentication:
  mode: development

repositories:
  - id: rd-skills
    name: R&D Skills
    provider: git
    git_url: git@github.com:YOUR_ORG/rd-skills.git
    branch: main
    git_auth:
      type: none
    enabled: true
    webhook_aliases:
      - YOUR_ORG/rd-skills
      - rd-skills
    audience:
      - developer
    visibility:
      - internal
    access:
      read_roles:
        - developer
        - internal
      sync_roles:
        - admin
    sync:
      polling_interval: 300

  - id: rd-knowledges
    name: R&D Knowledge
    provider: git
    git_url: git@github.com:YOUR_ORG/rd-knowledges.git
    branch: main
    git_auth:
      type: none
    enabled: true
    webhook_aliases:
      - YOUR_ORG/rd-knowledges
      - rd-knowledges
    audience:
      - developer
    visibility:
      - internal
    knowledge:
      enabled: true
    access:
      read_roles:
        - developer
        - internal
      sync_roles:
        - admin
    sync:
      polling_interval: 300
