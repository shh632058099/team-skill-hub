server:
  host: 0.0.0.0
  port: 8080

data_dir: /var/lib/team-skill-hub

authentication:
  mode: api-key

repositories:
  - id: rd-skills
    name: R&D Skills
    provider: git
    git_url: https://gitlab.company.example/ai/rd-skills.git
    branch: main
    enabled: true
    webhook_aliases: [ai/rd-skills, rd-skills]
    git_auth:
      type: https-token
      token_env: GITLAB_TOKEN
      username_env: GITLAB_USERNAME
    audience: [developer]
    visibility: [internal]
    access:
      read_roles: [developer, internal]
      sync_roles: [developer, admin]
    sync:
      polling_interval: 300
