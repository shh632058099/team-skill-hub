server:
  host: 0.0.0.0
  port: 8080

data_dir: /var/lib/team-skill-hub

default_roles:
  - developer
  - internal

authentication:
  mode: api-key

repositories:
  - id: rd-skills
    name: R&D Skills
    provider: git
    git_url: git@gitlab.company.example:ai/rd-skills.git
    branch: master
    enabled: true
    webhook_aliases:
      - ai/rd-skills
      - rd-skills
    git_auth:
      type: ssh
      ssh_key_path: /tmp/gitlab_ssh_key
      known_hosts_path: /tmp/gitlab_known_hosts
    audience:
      - developer
    visibility:
      - internal
    access:
      read_roles:
        - developer
        - internal
      sync_roles:
        - developer
        - admin
    sync:
      polling_interval: 300
    knowledge:
      enabled: true
      include:
        - docs/**
        - "**/*.md"
        - "**/*.txt"
        - "**/*.pdf"
        - "**/*.docx"
      exclude:
        - archive/**
        - generated/**
      max_document_bytes: 2097152
      chunk_size_chars: 1400
      chunk_overlap_chars: 180
    knowledge_publishing:
      enabled: false
      provider: gitlab
      base_url: https://gitlab.company.example
      project_path: ai/rd-skills
      token_env: GITLAB_WRITE_TOKEN
      target_branch: master
      branch_prefix: skill-hub-knowledge

  - id: customer-skills
    name: Customer Skills
    provider: git
    git_url: git@gitlab.company.example:ai/customer-skills.git
    branch: master
    enabled: true
    webhook_aliases:
      - ai/customer-skills
      - customer-skills
    git_auth:
      type: ssh
      ssh_key_path: /tmp/gitlab_ssh_key
      known_hosts_path: /tmp/gitlab_known_hosts
    audience:
      - customer
      - fae
    visibility:
      - customer
    access:
      read_roles:
        - customer
      sync_roles:
        - admin
    sync:
      polling_interval: 300
    knowledge:
      enabled: true
      include:
        - docs/**
        - "**/*.md"
        - "**/*.txt"
        - "**/*.pdf"
        - "**/*.docx"
      exclude:
        - archive/**
        - generated/**
      max_document_bytes: 2097152
      chunk_size_chars: 1400
      chunk_overlap_chars: 180
    knowledge_publishing:
      enabled: false
      provider: gitlab
      base_url: https://gitlab.company.example
      project_path: ai/customer-skills
      token_env: GITLAB_WRITE_TOKEN
      target_branch: master
      branch_prefix: skill-hub-knowledge
