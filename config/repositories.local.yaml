server:
  host: 127.0.0.1
  port: 18080

data_dir: ./data

default_roles:
  - developer
  - internal

authentication:
  mode: development

repositories:
  - id: rd-skills
    name: R&D Skills
    provider: local
    path: ../../rd-skills
    enabled: true
    audience:
      - developer
    visibility:
      - internal
    access:
      read_roles:
        - developer
        - internal
      sync_roles:
        - developer
        - admin
    sync:
      polling_interval: 30

  - id: customer-skills
    name: Customer Skills
    provider: local
    path: ../../customer-skills
    enabled: true
    audience:
      - customer
    visibility:
      - customer
    access:
      read_roles:
        - customer
      sync_roles:
        - admin
    sync:
      polling_interval: 30
