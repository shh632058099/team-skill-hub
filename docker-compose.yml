services:
  team-skill-hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bullseye-slim}
        INSTALL_GIT: ${INSTALL_GIT:-1}
    image: team-skill-hub:local
    container_name: team-skill-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "127.0.0.1:7443:7443"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CONFIG_PATH: /app/config/repositories.yaml
      DATA_DIR: /var/lib/team-skill-hub
      EXPERT_RUNTIME_DB: ${EXPERT_RUNTIME_DB:-/var/lib/team-skill-hub/expert-runtime.sqlite}
      EXPERT_GRPC_ADDRESS: ${EXPERT_GRPC_ADDRESS:-0.0.0.0:7443}
      HTTP_PROXY: ${SKILL_HUB_GIT_PROXY:-}
      HTTPS_PROXY: ${SKILL_HUB_GIT_PROXY:-}
      http_proxy: ${SKILL_HUB_GIT_PROXY:-}
      https_proxy: ${SKILL_HUB_GIT_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,team-skill-hub
      no_proxy: localhost,127.0.0.1,team-skill-hub
      OBSERVABILITY_WRITE_BACKEND: ${OBSERVABILITY_WRITE_BACKEND:-sqlite}
      OBSERVABILITY_READ_BACKEND: ${OBSERVABILITY_READ_BACKEND:-sqlite}
      OBSERVABILITY_SQLITE_PATH: ${OBSERVABILITY_SQLITE_PATH:-/var/lib/team-skill-hub/db/team-skill-hub.sqlite3}
      OBSERVABILITY_SHADOW_SQLITE: ${OBSERVABILITY_SHADOW_SQLITE:-false}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_LOGIN_REQUIRED: ${ADMIN_LOGIN_REQUIRED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      ADMIN_MAX_SESSIONS: ${ADMIN_MAX_SESSIONS:-20}
      ADMIN_LOGIN_MAX_FAILURES: ${ADMIN_LOGIN_MAX_FAILURES:-5}
      ADMIN_LOGIN_WINDOW_SECONDS: ${ADMIN_LOGIN_WINDOW_SECONDS:-300}
      ADMIN_SESSION_COOKIE_SECURE: ${ADMIN_SESSION_COOKIE_SECURE:-false}
      AUTH_MODE: ${AUTH_MODE:-development}
      SKILL_HUB_API_KEYS_JSON: ${SKILL_HUB_API_KEYS_JSON:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SKILL_HUB_ALLOWED_HOSTS:
    volumes:
      - ${SKILL_HUB_CONFIG_FILE:-./config/repositories.yaml}:/app/config/repositories.yaml:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      - ../customer-skills:/skills/customer-skills:ro
      - skill-hub-data:/var/lib/team-skill-hub
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  skill-hub-data:
