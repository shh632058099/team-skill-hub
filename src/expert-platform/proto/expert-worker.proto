syntax = "proto3";

package expert.v1;

service ExpertWorkerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc RenewLease(LeaseRequest) returns (LeaseResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (Empty);
  rpc FailTask(FailTaskRequest) returns (Empty);
  rpc ReportTaskStage(TaskStageRequest) returns (Empty);
}

message RegisterWorkerRequest {
  string worker_id = 1;
  repeated string capabilities = 2;
  string proposed_credential = 3;
}

message RegisterWorkerResponse {
  string status = 1;
  string credential = 2;
}

message ClaimTaskRequest {
  string worker_id = 1;
  string capability = 2;
  string expert_id = 3;
  string supported_backend = 4;
  repeated string supported_runtime_profiles = 5;
}
message ClaimTaskResponse {
  bool has_task = 1;
  string task_id = 2;
  string run_id = 3;
  uint64 fencing = 4;
  string problem = 5;
  string repository_id = 6;
  string repository_url = 7;
  string repository_branch = 8;
  string repository_credential_ref = 9;
  string repository_git_proxy_url = 10;
  string model_config_json = 11;
  string deployment_snapshot_json = 12;
}

message LeaseRequest {
  string worker_id = 1;
  string task_id = 2;
  string run_id = 3;
  uint64 fencing = 4;
}

message LeaseResponse {
  bool cancellation_requested = 1;
}

message CompleteTaskRequest {
  LeaseRequest claim = 1;
  string result = 2;
  string repository_url = 3;
  string repository_branch = 4;
  string commit_sha = 5;
}

message FailTaskRequest {
  LeaseRequest claim = 1;
  string reason = 2;
}

message TaskStageRequest {
  LeaseRequest claim = 1;
  string stage = 2;
  string details = 3;
  uint64 source_sequence = 4;
  string tool_code = 5;
  uint32 count = 6;
}

message Empty {}
