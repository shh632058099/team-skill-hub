syntax = "proto3";

package expert.v1;

service ExpertWorkerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc RenewLease(LeaseRequest) returns (LeaseResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (Empty);
  rpc FailTask(FailTaskRequest) returns (Empty);
  rpc ReportTaskStage(TaskStageRequest) returns (Empty);
  rpc ClaimWorkspaceCleanup(WorkspaceCleanupClaimRequest) returns (WorkspaceCleanupClaimResponse);
  rpc CompleteWorkspaceCleanup(WorkspaceCleanupCompleteRequest) returns (Empty);
  rpc ClaimPublicationOperation(PublicationOperationClaimRequest) returns (PublicationOperationClaimResponse);
  rpc CompletePublicationOperation(PublicationOperationCompleteRequest) returns (Empty);
  rpc ClaimChangeRequestOperation(ChangeRequestOperationClaimRequest) returns (ChangeRequestOperationClaimResponse);
  rpc CompleteChangeRequestOperation(ChangeRequestOperationCompleteRequest) returns (Empty);
}

message RegisterWorkerRequest {
  string worker_id = 1;
  repeated string capabilities = 2;
  string proposed_credential = 3;
}

message RegisterWorkerResponse {
  string status = 1;
  string credential = 2;
}

message ClaimTaskRequest {
  string worker_id = 1;
  string capability = 2;
  string expert_id = 3;
  string supported_backend = 4;
  repeated string supported_runtime_profiles = 5;
}
message ClaimTaskResponse {
  bool has_task = 1;
  string task_id = 2;
  string run_id = 3;
  uint64 fencing = 4;
  string problem = 5;
  string repository_id = 6;
  string repository_url = 7;
  string repository_branch = 8;
  string repository_credential_ref = 9;
  string repository_git_proxy_url = 10;
  string model_config_json = 11;
  string deployment_snapshot_json = 12;
  string workspace_key = 13;
  string validation_snapshot_json = 14;
  string runtime_session_id = 15;
}

message LeaseRequest {
  string worker_id = 1;
  string task_id = 2;
  string run_id = 3;
  uint64 fencing = 4;
}

message LeaseResponse {
  bool cancellation_requested = 1;
}

message CompleteTaskRequest {
  LeaseRequest claim = 1;
  string result = 2;
  string repository_url = 3;
  string repository_branch = 4;
  string commit_sha = 5;
  string verification_results_json = 6;
  string workspace_change_summary_json = 7;
  string runtime_session_id = 8;
}

message FailTaskRequest {
  LeaseRequest claim = 1;
  string reason = 2;
}

message TaskStageRequest {
  LeaseRequest claim = 1;
  string stage = 2;
  string details = 3;
  uint64 source_sequence = 4;
  string tool_code = 5;
  uint32 count = 6;
}

message WorkspaceCleanupClaimRequest {
  string worker_id = 1;
}

message WorkspaceCleanupClaimResponse {
  bool has_cleanup = 1;
  string workspace_id = 2;
  string workspace_key = 3;
  uint64 fencing = 4;
}

message WorkspaceCleanupCompleteRequest {
  string worker_id = 1;
  string workspace_id = 2;
  string workspace_key = 3;
  uint64 fencing = 4;
  bool success = 5;
  string error_code = 6;
}

message PublicationOperationClaimRequest {
  string worker_id = 1;
}

message PublicationOperationClaimResponse {
  bool has_operation = 1;
  string publication_id = 2;
  string operation = 3;
  uint64 fencing = 4;
  string workspace_id = 5;
  string branch_name = 6;
  string source_subject_revision = 7;
  string base_commit = 8;
  string commit_sha = 9;
  string tree_sha = 10;
  string artifact_ref = 11;
  string push_refspec = 12;
  uint64 commit_timestamp = 13;
  string commit_author_name = 14;
  string commit_author_email = 15;
  string commit_message = 16;
  string execution_snapshot_json = 17;
}

message PublicationOperationCompleteRequest {
  string worker_id = 1;
  string publication_id = 2;
  string operation = 3;
  uint64 fencing = 4;
  bool success = 5;
  string commit_sha = 6;
  string tree_sha = 7;
  string artifact_ref = 8;
  string push_refspec = 9;
  string error_code = 10;
  string error_context = 11;
}

message ChangeRequestOperationClaimRequest {
  string worker_id = 1;
}

message ChangeRequestOperationClaimResponse {
  bool has_operation = 1;
  string change_request_id = 2;
  uint64 fencing = 3;
  string repository_identity = 4;
  string repository_url = 5;
  string head_branch = 6;
  string head_commit = 7;
  string base_branch = 8;
  string title = 9;
  string body = 10;
  string idempotency_key = 11;
  string credential_grant_ref = 12;
}

message ChangeRequestOperationCompleteRequest {
  string worker_id = 1;
  string change_request_id = 2;
  uint64 fencing = 3;
  bool success = 4;
  string provider = 5;
  string external_id = 6;
  string url = 7;
  string head_commit = 8;
  string base_branch = 9;
  string error_code = 10;
}

message Empty {}
